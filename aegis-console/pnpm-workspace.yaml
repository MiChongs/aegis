# aegis-console 自身即 pnpm workspace 根。
#
# 必须存在：上级目录 D:\NodejsProjects\userSystem 是旧 Node.js 系统的 pnpm workspace 根，
# 若此文件缺失，pnpm 会向上解析到该根，把本项目的依赖装到上级 node_modules，
# 导致 next / react / typescript 在本目录下全部「未安装」。
packages:
  - .
# unrs-resolver 是 eslint-config-next 依赖的原生模块解析器（oxc-resolver 的 Rust 实现），
# 需要 postinstall 编译/下载原生二进制，不放行会导致 pnpm install 以非零码退出。
allowBuilds:
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@deck.gl/aggregation-layers@9.3.9'
  - '@deck.gl/core@9.3.9'
  - '@deck.gl/layers@9.3.9'
  - '@deck.gl/mapbox@9.3.9'
  - '@react-three/postprocessing@3.0.5'
  - sonner@2.0.8
  - lucide-react@1.31.0
  - react-dropzone@20.1.0
  - '@tanstack/react-table@9.1.2'
  - '@tanstack/table-core@9.1.2'
