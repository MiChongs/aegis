# ------------------------------------------------------------------------
# Aegis 专属检测规则（规则集 v2）
#
# ID 段 1101000-1101999。放在 REQUEST-901-INITIALIZATION 之后、其余 CRS 规则之前：
# 计分要用 901 初始化好的 tx.critical_anomaly_score 等变量，阻断由 949 统一评估，
# 因此这里的规则全部是 `block`（经 SecDefaultAction 解析为 pass + 计分），不直接 deny。
#
# 这些规则覆盖 CRS 不知道的 Aegis 自身约定，见 docs/firewall.md「专属规则」一节。
# ------------------------------------------------------------------------

# 内部服务头：X-Risk-Token / X-Risk-Operator 只由主服务转发给风控后台时添加，
# 外部请求带上它就是在试内部令牌。
SecRule REQUEST_HEADERS_NAMES "@rx ^x-risk-(?:token|operator)$" \
    "id:1101010,\
    phase:1,\
    block,\
    t:none,t:lowercase,\
    msg:'Aegis internal service header sent by client',\
    logdata:'Header: %{MATCHED_VAR}',\
    tag:'application-aegis',\
    tag:'attack-protocol',\
    tag:'aegis/internal-header',\
    tag:'paranoia-level/1',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# alg=none 的 JWT：过渡期内仍接受旧 HS256 用户令牌，none 算法是最常见的伪造手法。
SecRule REQUEST_HEADERS:Authorization "@rx ^(?i:bearer)\s+([A-Za-z0-9_-]{8,})\." \
    "id:1101020,\
    phase:1,\
    block,\
    capture,\
    t:none,\
    msg:'JWT using alg=none',\
    logdata:'Header: %{TX.1}',\
    tag:'application-aegis',\
    tag:'attack-protocol',\
    tag:'aegis/jwt-none',\
    tag:'paranoia-level/1',\
    severity:'CRITICAL',\
    chain"
    SecRule TX:1 "@rx (?i)\"alg\"\s*:\s*\"none\"" \
        "t:none,t:base64DecodeExt,\
        setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 接入网关路径里的 appKey 只允许字母、数字、下划线与连字符（1-64 位）。
SecRule REQUEST_FILENAME "@rx ^/api/v1/apps/([^/]*)" \
    "id:1101030,\
    phase:1,\
    block,\
    capture,\
    t:none,\
    msg:'Malformed appKey in Aegis gateway path',\
    logdata:'appKey: %{TX.1}',\
    tag:'application-aegis',\
    tag:'attack-protocol',\
    tag:'aegis/gateway-appkey',\
    tag:'paranoia-level/1',\
    severity:'ERROR',\
    chain"
    SecRule TX:1 "!@rx ^[A-Za-z0-9_-]{1,64}$" \
        "t:none,\
        setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 国内云厂商的实例元数据地址（CRS 的 ssrf.data 只收了 AWS / GCP / Azure 系）：
# 阿里云 100.100.100.200、腾讯云 metadata.tencentyun.com / 169.254.0.23、
# 火山引擎 100.96.0.96、华为云 / 百度云 / 京东云与 OpenStack 同为 169.254.169.254。
# Aegis 有不少接受 URL 的字段（Webhook、远程函数、出海代理、头像地址），都可能被拿来做 SSRF。
SecRule ARGS|REQUEST_HEADERS:Referer "@rx (?i)(?:^|[^0-9a-z.])(?:100\.100\.100\.200|100\.96\.0\.96|169\.254\.0\.23|169\.254\.169\.254|metadata\.tencentyun\.com|metadata\.google\.internal|100\.100\.0\.200)(?:[:/?#]|$)" \
    "id:1101040,\
    phase:2,\
    block,\
    t:none,t:urlDecodeUni,\
    msg:'Cloud instance metadata address in request (SSRF)',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'application-aegis',\
    tag:'attack-ssrf',\
    tag:'aegis/cloud-metadata',\
    tag:'paranoia-level/1',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 解密后仍带 Transport v2 / 旧加密的封装参数：密文里再包一层 `_payload`，
# 正常客户端不会这样构造，常见于把攻击串藏进二次封装、指望 WAF 只看外层。
SecRule ARGS_GET_NAMES "@streq _payload" \
    "id:1101050,\
    phase:1,\
    block,\
    t:none,\
    msg:'Nested encrypted payload parameter after decryption',\
    tag:'application-aegis',\
    tag:'attack-protocol',\
    tag:'aegis/nested-payload',\
    tag:'paranoia-level/1',\
    severity:'WARNING',\
    chain"
    SecRule TX:AEGIS_TRANSPORT "@rx ^(?:sealed|legacy)$" \
        "t:none,\
        setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

# 在 URL 里传会话令牌：PASETO v4.local 或 JWT 出现在查询串，会进代理与 CDN 日志。只计 notice。
SecRule ARGS_GET "@rx ^(?:v4\.local\.[A-Za-z0-9_-]{20,}|eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.)" \
    "id:1101060,\
    phase:1,\
    block,\
    t:none,\
    msg:'Session token passed in query string',\
    logdata:'Parameter: %{MATCHED_VAR_NAME}',\
    tag:'application-aegis',\
    tag:'attack-protocol',\
    tag:'aegis/token-in-url',\
    tag:'paranoia-level/2',\
    severity:'NOTICE',\
    chain"
    SecRule TX:DETECTION_PARANOIA_LEVEL "@ge 2" \
        "t:none,\
        setvar:'tx.inbound_anomaly_score_pl2=+%{tx.notice_anomaly_score}'"
