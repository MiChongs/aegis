# ══════════════════════════════════════════════════════════════════════════
#  Aegis 容器编排
# ══════════════════════════════════════════════════════════════════════════
#
#  三档启动方式（profiles 分层）：
#
#  ① 核心基础设施（默认，本机 go run 开发时使用）
#       docker compose -f deploy/docker/docker-compose.yml up -d
#     → postgres + redis + nats
#
#  ② 完整基础设施（含工作流引擎与管理界面）
#       docker compose -f deploy/docker/docker-compose.yml --profile full up -d
#     → 核心 + temporal(+库) + temporal-ui + nats-ui + rdkit-captcha
#
#  ③ 容器化全栈（含 Aegis 后端，自动执行数据库迁移）
#       docker compose --env-file .env -f deploy/docker/docker-compose.yml --profile app up -d
#     → 完整基础设施 + migrate（一次性迁移）+ server
#
#  ④ 对外 OAuth2 / OIDC 授权服务器（可与以上任一档叠加）
#       … --profile oauth2 up -d
#     → hydra-db-init + hydra-migrate（一次性）+ hydra
#     .env 里需 OAUTH2_SERVER_ENABLED=true 与 HYDRA_* 密钥（一键脚本会生成）
#
#  ⑤ 风控平台（docs/risk-platform.md，可与 app 叠加）
#       … --profile app --profile risk up -d
#     → etcd ×3、Redis Cluster ×6、MinIO、Milvus、NebulaGraph、ClickHouse、RisingWave、
#       Flink（CEP 作业）、risk-migrate（一次性初始化）、risk-decision、risk-admin、risk-ingest
#
#  推荐直接使用一键脚本（自动生成强随机凭据并完成上述全部步骤）：
#       Linux/macOS:  ./deploy/docker/quickstart.sh
#       Windows:      .\deploy\docker\quickstart.ps1
#
#  凭据与端口均可通过环境变量覆盖（一键脚本会写入仓库根目录 .env，
#  使用 --env-file 指向它即可让下方 ${VAR:-默认值} 全部生效）。
# ══════════════════════════════════════════════════════════════════════════

# 统一日志限额：防止长期运行的容器日志撑爆磁盘
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

# 风控服务共用的连接配置（容器网络内的地址）
x-risk-env: &risk-env
  RISK_ETCD_ENDPOINTS: risk-etcd-1:2379,risk-etcd-2:2379,risk-etcd-3:2379
  RISK_REDIS_ADDRS: risk-redis-1:7001,risk-redis-2:7002,risk-redis-3:7003,risk-redis-4:7004,risk-redis-5:7005,risk-redis-6:7006
  RISK_REDIS_PASSWORD: ${RISK_REDIS_PASSWORD:-aegis-risk}
  RISK_PG_DSN: postgres://${AEGIS_DB_USER:-aegis}:${AEGIS_DB_PASSWORD:-aegis}@postgres:5432/${RISK_DB_NAME:-aegis_risk}?sslmode=disable
  RISK_PG_ADMIN_DSN: postgres://${AEGIS_DB_USER:-aegis}:${AEGIS_DB_PASSWORD:-aegis}@postgres:5432/${AEGIS_DB_NAME:-aegis}?sslmode=disable
  RISK_NATS_URL: nats://nats:4222
  RISK_CLICKHOUSE_ADDR: risk-clickhouse:9000
  RISK_CLICKHOUSE_USER: ${RISK_CLICKHOUSE_USER:-aegis}
  RISK_CLICKHOUSE_PASSWORD: ${RISK_CLICKHOUSE_PASSWORD:-aegis-risk}
  RISK_CLICKHOUSE_DB: aegis_risk
  RISK_NEBULA_ADDRS: risk-nebula-graphd:9669
  RISK_NEBULA_USER: root
  RISK_NEBULA_PASSWORD: ${RISK_NEBULA_PASSWORD:-nebula}
  RISK_NEBULA_STORAGED: risk-nebula-storaged:9779
  RISK_MILVUS_ADDR: risk-milvus:19530
  RISK_RISINGWAVE_DSN: postgres://root@risk-risingwave:4566/dev?sslmode=disable
  RISK_S3_ENDPOINT: risk-minio:9000
  RISK_S3_ACCESS_KEY: ${RISK_MINIO_ACCESS_KEY:-minioadmin}
  RISK_S3_SECRET_KEY: ${RISK_MINIO_SECRET_KEY:-minioadmin}
  RISK_S3_BUCKET: aegis-risk
  RISK_INTERNAL_TOKEN: ${RISK_INTERNAL_TOKEN:-}
  RISK_ADMIN_URL: http://risk-admin:8891

# etcd 集群节点
x-risk-etcd: &risk-etcd
  image: quay.io/coreos/etcd:v3.7.3
  profiles: ["risk"]
  restart: unless-stopped
  logging: *default-logging
  entrypoint: ["/usr/local/bin/etcd"]
  healthcheck:
    test: ["CMD", "/usr/local/bin/etcdctl", "endpoint", "health"]
    interval: 10s
    timeout: 5s
    retries: 10

# Redis Cluster 节点：三主三从，各节点用自己的端口号（宿主机 1:1 映射，本机调试时地址可以对上）
x-risk-redis: &risk-redis
  image: redis:8-alpine
  profiles: ["risk"]
  restart: unless-stopped
  logging: *default-logging
  healthcheck:
    test: ["CMD-SHELL", "redis-cli -p $$REDIS_PORT -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
    interval: 5s
    timeout: 3s
    retries: 20

services:
  # ── 主数据库：PostgreSQL 17 + PostGIS（地理风控/分析依赖） ──
  postgres:
    build:
      context: ./postgres
    image: aegis-postgres:pg17-postgis
    container_name: aegis-postgres
    restart: unless-stopped
    # 并行查询用 /dev/shm（docker 默认只给 64 MB）；库侧参数见 postgres/tuning.sql
    shm_size: 1g
    logging: *default-logging
    environment:
      POSTGRES_DB: ${AEGIS_DB_NAME:-aegis}
      POSTGRES_USER: ${AEGIS_DB_USER:-aegis}
      POSTGRES_PASSWORD: ${AEGIS_DB_PASSWORD:-aegis}
    ports:
      # 宿主机 15432 → 容器 5432：避开本机原生 PostgreSQL 占用的 5432
      - "${AEGIS_DB_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AEGIS_DB_USER:-aegis} -d ${AEGIS_DB_NAME:-aegis}"]
      interval: 3s
      timeout: 3s
      retries: 15

  # ── 缓存 / 会话存储 ──
  redis:
    image: redis:8-alpine
    container_name: aegis-redis
    restart: unless-stopped
    logging: *default-logging
    # 启用 AOF 持久化：容器重建后会话/防爆破计数等不丢失
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${AEGIS_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  # ── 消息队列：NATS JetStream ──
  nats:
    image: nats:2.11-alpine
    container_name: aegis-nats
    restart: unless-stopped
    logging: *default-logging
    # -js 启用 JetStream；-sd 指定持久化目录（配合数据卷）
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "${AEGIS_NATS_PORT:-4222}:4222"
      - "${AEGIS_NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── NATS 管理界面（可选） ──
  nats-ui:
    image: ghcr.io/nats-nui/nui:latest
    container_name: aegis-nats-ui
    profiles: ["full", "ui"]
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${NATS_UI_PORT:-31311}:31311"
    volumes:
      - nats_ui_data:/db
    depends_on:
      nats:
        condition: service_healthy

  # ── Temporal 专用数据库 ──
  temporal-postgres:
    image: postgres:17-alpine
    container_name: aegis-temporal-postgres
    profiles: ["full", "app"]
    restart: unless-stopped
    logging: *default-logging
    networks:
      default:
        aliases:
          - temporalpostgres
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:-temporal}
    ports:
      - "${TEMPORAL_DB_PORT:-5433}:5432"
    volumes:
      - temporal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 3s
      timeout: 3s
      retries: 15

  # ── 工作流引擎：Temporal ──
  temporal:
    image: temporalio/auto-setup:latest
    container_name: aegis-temporal
    profiles: ["full", "app"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:-temporal}
      POSTGRES_SEEDS: temporalpostgres
      BIND_ON_IP: 0.0.0.0
      TEMPORAL_ADDRESS: 127.0.0.1:7233
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    depends_on:
      temporal-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "tctl --address 127.0.0.1:7233 cluster health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── Temporal 管理界面（可选） ──
  temporal-ui:
    image: temporalio/ui:latest
    container_name: aegis-temporal-ui
    profiles: ["full", "ui"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      TEMPORAL_ADDRESS: ${TEMPORAL_UI_BACKEND_ADDRESS:-temporal:7233}
      TEMPORAL_CORS_ORIGINS: ${TEMPORAL_UI_CORS_ORIGINS:-http://localhost:3000,http://localhost:8088}
      TEMPORAL_UI_PORT: 8080
      TEMPORAL_UI_PUBLIC_PATH: ${TEMPORAL_UI_PUBLIC_PATH:-}
      TEMPORAL_AUTH_ENABLED: ${TEMPORAL_AUTH_ENABLED:-false}
      TEMPORAL_AUTH_PROVIDER_URL: ${TEMPORAL_AUTH_PROVIDER_URL:-}
      TEMPORAL_AUTH_CLIENT_ID: ${TEMPORAL_AUTH_CLIENT_ID:-}
      TEMPORAL_AUTH_CLIENT_SECRET: ${TEMPORAL_AUTH_CLIENT_SECRET:-}
      TEMPORAL_AUTH_CALLBACK_URL: ${TEMPORAL_AUTH_CALLBACK_URL:-}
      TEMPORAL_AUTH_SCOPES: ${TEMPORAL_AUTH_SCOPES:-openid,profile,email}
      TEMPORAL_CSRF_COOKIE_INSECURE: ${TEMPORAL_CSRF_COOKIE_INSECURE:-true}
      TEMPORAL_UI_DEFAULT_LANGUAGE: ${TEMPORAL_UI_DEFAULT_LANGUAGE:-zh}
      TEMPORAL_DEFAULT_LANGUAGE: ${TEMPORAL_UI_DEFAULT_LANGUAGE:-zh}
    ports:
      - "${TEMPORAL_UI_PORT:-8233}:8080"
    depends_on:
      temporal:
        condition: service_started

  # ── 化学结构验证码服务（可选组件） ──
  rdkit-captcha:
    build:
      context: ../..
      dockerfile: deploy/docker/rdkit-captcha/Dockerfile
    container_name: aegis-rdkit-captcha
    profiles: ["full", "app"]
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${RDKIT_CAPTCHA_PORT:-5050}:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── OAuth2 / OIDC 授权服务器：Ory Hydra（可选，profile: oauth2） ──
  #  Hydra 负责协议，Aegis 负责登录与同意页，详见 docs/oauth2-provider.md 与 hydra/hydra.yml。
  #  启用：.env 里 OAUTH2_SERVER_ENABLED=true，启动时加 --profile oauth2。
  #  数据放在同一个 Postgres 实例的独立 hydra 库里，与 Aegis 的表互不相干。
  hydra-db-init:
    image: postgres:17-alpine
    container_name: aegis-hydra-db-init
    profiles: ["oauth2"]
    restart: "no"
    logging: *default-logging
    environment:
      PGHOST: postgres
      PGUSER: ${AEGIS_DB_USER:-aegis}
      PGPASSWORD: ${AEGIS_DB_PASSWORD:-aegis}
      PGDATABASE: ${AEGIS_DB_NAME:-aegis}
    # 幂等：库已存在则什么都不做
    command: ["sh", "-c", "psql -tAc \"SELECT 1 FROM pg_database WHERE datname = 'hydra'\" | grep -q 1 || psql -c 'CREATE DATABASE hydra'"]
    depends_on:
      postgres:
        condition: service_healthy

  hydra-migrate:
    image: oryd/hydra:v26.2.0
    container_name: aegis-hydra-migrate
    profiles: ["oauth2"]
    restart: "no"
    logging: *default-logging
    environment:
      DSN: postgres://${AEGIS_DB_USER:-aegis}:${AEGIS_DB_PASSWORD:-aegis}@postgres:5432/hydra?sslmode=disable
    command: ["migrate", "sql", "up", "-e", "--yes"]
    depends_on:
      hydra-db-init:
        condition: service_completed_successfully

  hydra:
    image: oryd/hydra:v26.2.0
    container_name: aegis-hydra
    profiles: ["oauth2"]
    restart: unless-stopped
    logging: *default-logging
    # HYDRA_DEV_FLAG=--dev 只用于本机 http 调试：它会关掉 Hydra 的若干安全检查
    command: serve all -c /etc/config/hydra/hydra.yml ${HYDRA_DEV_FLAG:-}
    environment:
      DSN: postgres://${AEGIS_DB_USER:-aegis}:${AEGIS_DB_PASSWORD:-aegis}@postgres:5432/hydra?sslmode=disable&max_conns=20&max_idle_conns=4
      # 签发方：接入方配置里填的那个地址，必须与浏览器访问 Hydra 公开端的地址完全一致
      URLS_SELF_ISSUER: ${HYDRA_PUBLIC_URL:-http://localhost:4444}
      # 登录 / 同意 / 登出页由 Aegis 提供，是浏览器视角的 Aegis 地址
      URLS_LOGIN: ${API_BASE_URL:-http://localhost:8088}/oauth2/login
      URLS_CONSENT: ${API_BASE_URL:-http://localhost:8088}/oauth2/consent
      URLS_LOGOUT: ${API_BASE_URL:-http://localhost:8088}/oauth2/logout
      URLS_ERROR: ${API_BASE_URL:-http://localhost:8088}/oauth2/error
      URLS_POST_LOGOUT_REDIRECT: ${API_BASE_URL:-http://localhost:8088}/oauth2/logged-out
      URLS_DEVICE_VERIFICATION: ${API_BASE_URL:-http://localhost:8088}/oauth2/device
      URLS_DEVICE_SUCCESS: ${API_BASE_URL:-http://localhost:8088}/oauth2/device/done
      SECRETS_SYSTEM: ${HYDRA_SYSTEM_SECRET:-}
      OIDC_SUBJECT_IDENTIFIERS_PAIRWISE_SALT: ${HYDRA_PAIRWISE_SALT:-}
      # 令牌钩子是容器网络里的 Aegis；Aegis 跑在宿主机（go run）时改成 http://host.docker.internal:8088/...
      OAUTH2_TOKEN_HOOK_URL: ${HYDRA_TOKEN_HOOK_URL:-http://server:8088/api/oauth2/hooks/token}
      OAUTH2_TOKEN_HOOK_AUTH_CONFIG_VALUE: Bearer ${HYDRA_TOKEN_HOOK_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HYDRA_PUBLIC_PORT:-4444}:4444"
      # 管理端不做任何认证，只绑回环：供宿主机上 go run 的 Aegis 访问，绝不能暴露到公网
      - "127.0.0.1:${HYDRA_ADMIN_PORT:-4445}:4445"
    volumes:
      - ./hydra:/etc/config/hydra:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4445/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully

  # ── 数据库迁移（一次性任务，server 启动前自动执行） ──
  migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: aegis-server:latest
    container_name: aegis-migrate
    profiles: ["app"]
    restart: "no"
    logging: *default-logging
    env_file:
      # required:false —— 仅启基础设施（无 .env）时不报解析错误
      - path: ../../.env
        required: false
    environment:
      # 容器内必须使用服务名访问数据库（覆盖 .env 中可能的 localhost 配置）
      POSTGRES_DSN: postgres://${AEGIS_DB_USER:-aegis}:${AEGIS_DB_PASSWORD:-aegis}@postgres:5432/${AEGIS_DB_NAME:-aegis}?sslmode=disable
    command: ["/usr/local/bin/aegis-server", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  # ── Aegis 后端（Unified 模式：API + Worker） ──
  server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: aegis-server:latest
    container_name: aegis-server
    profiles: ["app"]
    restart: unless-stopped
    logging: *default-logging
    env_file:
      # 真实配置来自仓库根目录 .env（由一键脚本生成，或参照 .env.example 手工创建）
      - path: ../../.env
        required: false
    environment:
      # 容器内服务发现：覆盖宿主机视角的连接串
      POSTGRES_DSN: postgres://${AEGIS_DB_USER:-aegis}:${AEGIS_DB_PASSWORD:-aegis}@postgres:5432/${AEGIS_DB_NAME:-aegis}?sslmode=disable
      REDIS_ADDR: redis:6379
      NATS_URL: nats://nats:4222
      # passthrough:/// 前缀不可省略：Temporal SDK 底层的 grpc-go NewClient 默认使用 dns
      # scheme，其自带 DNS resolver 在 Docker 内置 DNS（127.0.0.11）下解析超时，导致
      # Workflow 功能静默降级；passthrough 改由 Go 标准库解析，可正常连通。
      TEMPORAL_HOST_PORT: passthrough:///temporal:7233
      RDKIT_CAPTCHA_URL: http://rdkit-captcha:5000
      # 授权服务器（profile: oauth2）的管理端，容器网络内的地址
      HYDRA_ADMIN_URL: http://hydra:4445
      # 一起听微服务的内部管理接口（Connect/gRPC，只在容器网络内可达）
      LISTEN_TOGETHER_RPC_URL: http://listen-together:8091
      # 风控平台（profile: risk）：经 etcd 发现 risk-decision / risk-admin；没起风控时按场景失败策略放行
      RISK_ETCD_ENDPOINTS: ${RISK_ETCD_ENDPOINTS:-risk-etcd-1:2379,risk-etcd-2:2379,risk-etcd-3:2379}
      RISK_INTERNAL_TOKEN: ${RISK_INTERNAL_TOKEN:-}
      # HTTPS + HTTP/3（TLS_ENABLED=true 时才监听）：容器内固定 8443，对外端口由下面的映射决定，
      # Alt-Svc 宣告与明文跳转用的是对外端口。证书放进 TLS_CERT_DIR，.env 里写容器内路径
      # （TLS_CERT_FILE=/etc/aegis/tls/fullchain.pem）；用 ACME 时证书缓存在 aegis_autocert 卷里。
      HTTPS_PORT: "8443"
      HTTP3_PORT: "8443"
      HTTPS_PUBLIC_PORT: ${HTTPS_PUBLIC_PORT:-8443}
    command: ["/usr/local/bin/aegis-server"]
    ports:
      - "${HTTP_PORT:-8088}:8088"
      # 同一个端口号，TCP 与 UDP 都要映射：只映射 TCP 时 HTTPS 照常可用，但客户端永远升级不到 HTTP/3
      - "${HTTPS_PUBLIC_PORT:-8443}:8443/tcp"
      - "${HTTPS_PUBLIC_PORT:-8443}:8443/udp"
    volumes:
      - ${TLS_CERT_DIR:-../../.runtime/tls}:/etc/aegis/tls:ro
      - aegis_autocert:/app/.runtime/autocert
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      temporal:
        condition: service_healthy
      rdkit-captcha:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8088/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── 一起听微服务（services/listentogether，docs/listen-together.md）──
  #  独立进程：长连接与房间状态都在这里，主服务只签票据与转发管理操作。
  #  可水平扩容（docker compose up --scale listen-together=3），实例间经 Redis 共享状态、经 NATS 同步事件。
  #  对外只暴露 8090（WebSocket），8091 管理接口与指标只在容器网络内。
  listen-together:
    build:
      context: ../..
      dockerfile: deploy/docker/listen-together.Dockerfile
    image: aegis-listen-together:latest
    profiles: ["app", "listen"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      LT_REDIS_URL: redis://redis:6379/0
      LT_NATS_URL: nats://nats:4222
      LT_TICKET_JWKS_URL: http://server:8088/api/listen-together/jwks.json
      LT_INTERNAL_TOKEN: ${LISTEN_TOGETHER_INTERNAL_TOKEN:-}
      LT_ALLOWED_ORIGINS: ${LISTEN_TOGETHER_ALLOWED_ORIGINS:-*}
      LT_OTLP_ENDPOINT: ${LISTEN_TOGETHER_OTLP_ENDPOINT:-}
    ports:
      - "${LISTEN_TOGETHER_PORT:-8090}:8090"
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8090/readyz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ════════════════════════════ 风控平台（profile: risk）════════════════════════════
  #  docs/risk-platform.md。基础设施在前，三个 Go 服务与 Flink 作业在后。

  # ── etcd：服务注册发现、配置发布通道、选主；Milvus 元数据也放这里 ──
  risk-etcd-1:
    <<: *risk-etcd
    container_name: aegis-risk-etcd-1
    command:
      - --name=etcd-1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://risk-etcd-1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://risk-etcd-1:2380
      - --initial-cluster=etcd-1=http://risk-etcd-1:2380,etcd-2=http://risk-etcd-2:2380,etcd-3=http://risk-etcd-3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=aegis-risk
      - --auto-compaction-mode=revision
      - --auto-compaction-retention=1000
      - --quota-backend-bytes=4294967296
      - --snapshot-count=50000
    ports:
      # 只绑回环：本机 go run 的风控服务与主服务经它做服务发现
      - "127.0.0.1:${RISK_ETCD_PORT:-2379}:2379"
    volumes:
      - risk_etcd_1:/etcd-data

  risk-etcd-2:
    <<: *risk-etcd
    container_name: aegis-risk-etcd-2
    command:
      - --name=etcd-2
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://risk-etcd-2:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://risk-etcd-2:2380
      - --initial-cluster=etcd-1=http://risk-etcd-1:2380,etcd-2=http://risk-etcd-2:2380,etcd-3=http://risk-etcd-3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=aegis-risk
      - --auto-compaction-mode=revision
      - --auto-compaction-retention=1000
      - --quota-backend-bytes=4294967296
      - --snapshot-count=50000
    volumes:
      - risk_etcd_2:/etcd-data

  risk-etcd-3:
    <<: *risk-etcd
    container_name: aegis-risk-etcd-3
    command:
      - --name=etcd-3
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://risk-etcd-3:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://risk-etcd-3:2380
      - --initial-cluster=etcd-1=http://risk-etcd-1:2380,etcd-2=http://risk-etcd-2:2380,etcd-3=http://risk-etcd-3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=aegis-risk
      - --auto-compaction-mode=revision
      - --auto-compaction-retention=1000
      - --quota-backend-bytes=4294967296
      - --snapshot-count=50000
    volumes:
      - risk_etcd_3:/etcd-data

  # ── Redis Cluster：名单、滑窗计数、流式特征、缓存 ──
  risk-redis-1:
    <<: *risk-redis
    container_name: aegis-risk-redis-1
    environment:
      REDIS_PORT: "7001"
      REDIS_PASSWORD: ${RISK_REDIS_PASSWORD:-aegis-risk}
    command: >-
      sh -c 'exec redis-server --port 7001 --cluster-enabled yes --cluster-config-file /data/nodes.conf
      --cluster-node-timeout 5000 --appendonly yes --appendfsync everysec
      --requirepass "$$REDIS_PASSWORD" --masterauth "$$REDIS_PASSWORD"
      --cluster-announce-hostname risk-redis-1 --cluster-preferred-endpoint-type hostname
      --maxmemory-policy noeviction'
    ports:
      - "127.0.0.1:7001:7001"
    volumes:
      - risk_redis_1:/data

  risk-redis-2:
    <<: *risk-redis
    container_name: aegis-risk-redis-2
    environment:
      REDIS_PORT: "7002"
      REDIS_PASSWORD: ${RISK_REDIS_PASSWORD:-aegis-risk}
    command: >-
      sh -c 'exec redis-server --port 7002 --cluster-enabled yes --cluster-config-file /data/nodes.conf
      --cluster-node-timeout 5000 --appendonly yes --appendfsync everysec
      --requirepass "$$REDIS_PASSWORD" --masterauth "$$REDIS_PASSWORD"
      --cluster-announce-hostname risk-redis-2 --cluster-preferred-endpoint-type hostname
      --maxmemory-policy noeviction'
    ports:
      - "127.0.0.1:7002:7002"
    volumes:
      - risk_redis_2:/data

  risk-redis-3:
    <<: *risk-redis
    container_name: aegis-risk-redis-3
    environment:
      REDIS_PORT: "7003"
      REDIS_PASSWORD: ${RISK_REDIS_PASSWORD:-aegis-risk}
    command: >-
      sh -c 'exec redis-server --port 7003 --cluster-enabled yes --cluster-config-file /data/nodes.conf
      --cluster-node-timeout 5000 --appendonly yes --appendfsync everysec
      --requirepass "$$REDIS_PASSWORD" --masterauth "$$REDIS_PASSWORD"
      --cluster-announce-hostname risk-redis-3 --cluster-preferred-endpoint-type hostname
      --maxmemory-policy noeviction'
    ports:
      - "127.0.0.1:7003:7003"
    volumes:
      - risk_redis_3:/data

  risk-redis-4:
    <<: *risk-redis
    container_name: aegis-risk-redis-4
    environment:
      REDIS_PORT: "7004"
      REDIS_PASSWORD: ${RISK_REDIS_PASSWORD:-aegis-risk}
    command: >-
      sh -c 'exec redis-server --port 7004 --cluster-enabled yes --cluster-config-file /data/nodes.conf
      --cluster-node-timeout 5000 --appendonly yes --appendfsync everysec
      --requirepass "$$REDIS_PASSWORD" --masterauth "$$REDIS_PASSWORD"
      --cluster-announce-hostname risk-redis-4 --cluster-preferred-endpoint-type hostname
      --maxmemory-policy noeviction'
    ports:
      - "127.0.0.1:7004:7004"
    volumes:
      - risk_redis_4:/data

  risk-redis-5:
    <<: *risk-redis
    container_name: aegis-risk-redis-5
    environment:
      REDIS_PORT: "7005"
      REDIS_PASSWORD: ${RISK_REDIS_PASSWORD:-aegis-risk}
    command: >-
      sh -c 'exec redis-server --port 7005 --cluster-enabled yes --cluster-config-file /data/nodes.conf
      --cluster-node-timeout 5000 --appendonly yes --appendfsync everysec
      --requirepass "$$REDIS_PASSWORD" --masterauth "$$REDIS_PASSWORD"
      --cluster-announce-hostname risk-redis-5 --cluster-preferred-endpoint-type hostname
      --maxmemory-policy noeviction'
    ports:
      - "127.0.0.1:7005:7005"
    volumes:
      - risk_redis_5:/data

  risk-redis-6:
    <<: *risk-redis
    container_name: aegis-risk-redis-6
    environment:
      REDIS_PORT: "7006"
      REDIS_PASSWORD: ${RISK_REDIS_PASSWORD:-aegis-risk}
    command: >-
      sh -c 'exec redis-server --port 7006 --cluster-enabled yes --cluster-config-file /data/nodes.conf
      --cluster-node-timeout 5000 --appendonly yes --appendfsync everysec
      --requirepass "$$REDIS_PASSWORD" --masterauth "$$REDIS_PASSWORD"
      --cluster-announce-hostname risk-redis-6 --cluster-preferred-endpoint-type hostname
      --maxmemory-policy noeviction'
    ports:
      - "127.0.0.1:7006:7006"
    volumes:
      - risk_redis_6:/data

  # 建集群（幂等：已经成形就什么都不做）
  risk-redis-init:
    image: redis:8-alpine
    container_name: aegis-risk-redis-init
    profiles: ["risk"]
    restart: "no"
    logging: *default-logging
    environment:
      REDISCLI_AUTH: ${RISK_REDIS_PASSWORD:-aegis-risk}
    command:
      - sh
      - -c
      - |
        if redis-cli -h risk-redis-1 -p 7001 cluster info | grep -q 'cluster_state:ok'; then echo 'cluster ready'; exit 0; fi
        yes yes | redis-cli --cluster create risk-redis-1:7001 risk-redis-2:7002 risk-redis-3:7003 \
          risk-redis-4:7004 risk-redis-5:7005 risk-redis-6:7006 --cluster-replicas 1
        for i in $$(seq 1 30); do
          redis-cli -h risk-redis-1 -p 7001 cluster info | grep -q 'cluster_state:ok' && exit 0
          sleep 1
        done
        exit 1
    depends_on:
      risk-redis-1: {condition: service_healthy}
      risk-redis-2: {condition: service_healthy}
      risk-redis-3: {condition: service_healthy}
      risk-redis-4: {condition: service_healthy}
      risk-redis-5: {condition: service_healthy}
      risk-redis-6: {condition: service_healthy}

  # ── 对象存储：Milvus 数据、RisingWave 无关、风控模型文件 ──
  risk-minio:
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: aegis-risk-minio
    profiles: ["risk"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      MINIO_ACCESS_KEY: ${RISK_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${RISK_MINIO_SECRET_KEY:-minioadmin}
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "127.0.0.1:${RISK_MINIO_PORT:-19100}:9000"
      - "127.0.0.1:${RISK_MINIO_CONSOLE_PORT:-19101}:9001"
    volumes:
      - risk_minio:/minio_data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Milvus：设备指纹与行为向量 ──
  risk-milvus-volume-init:
    image: milvusdb/milvus:v3.0.5
    container_name: aegis-risk-milvus-volume-init
    profiles: ["risk"]
    user: "0:0"
    network_mode: none
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        uid="$$(id -u milvus)"; gid="$$(id -g milvus)"
        marker="/var/lib/milvus/.milvus-volume-owner-$${uid}-$${gid}"
        if [ ! -e "$${marker}" ]; then chown -R "$${uid}:$${gid}" /var/lib/milvus; touch "$${marker}"; chown "$${uid}:$${gid}" "$${marker}"; fi
    volumes:
      - risk_milvus:/var/lib/milvus

  risk-milvus:
    image: milvusdb/milvus:v3.0.5
    container_name: aegis-risk-milvus
    profiles: ["risk"]
    restart: unless-stopped
    logging: *default-logging
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: risk-etcd-1:2379,risk-etcd-2:2379,risk-etcd-3:2379
      MINIO_ADDRESS: risk-minio:9000
      MINIO_ACCESS_KEY_ID: ${RISK_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${RISK_MINIO_SECRET_KEY:-minioadmin}
      MINIO_REGION: us-east-1
    ports:
      - "127.0.0.1:${RISK_MILVUS_PORT:-19530}:19530"
    volumes:
      - risk_milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      start_period: 90s
      timeout: 10s
      retries: 10
    depends_on:
      risk-milvus-volume-init: {condition: service_completed_successfully}
      risk-etcd-1: {condition: service_healthy}
      risk-etcd-2: {condition: service_healthy}
      risk-etcd-3: {condition: service_healthy}
      risk-minio: {condition: service_healthy}

  # ── NebulaGraph：关系图（meta / storage / graph 各一）──
  risk-nebula-metad:
    image: vesoft/nebula-metad:v3.8.0
    container_name: aegis-risk-nebula-metad
    profiles: ["risk"]
    restart: unless-stopped
    logging: *default-logging
    command:
      - --meta_server_addrs=risk-nebula-metad:9559
      - --local_ip=risk-nebula-metad
      - --ws_ip=risk-nebula-metad
      - --port=9559
      - --ws_http_port=19559
      - --data_path=/data/meta
      - --log_dir=/logs
      - --v=0
      - --minloglevel=0
    volumes:
      - risk_nebula_meta:/data/meta
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://risk-nebula-metad:19559/status"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  risk-nebula-storaged:
    image: vesoft/nebula-storaged:v3.8.0
    container_name: aegis-risk-nebula-storaged
    profiles: ["risk"]
    restart: unless-stopped
    logging: *default-logging
    command:
      - --meta_server_addrs=risk-nebula-metad:9559
      - --local_ip=risk-nebula-storaged
      - --ws_ip=risk-nebula-storaged
      - --port=9779
      - --ws_http_port=19779
      - --data_path=/data/storage
      - --log_dir=/logs
      - --v=0
      - --minloglevel=0
    volumes:
      - risk_nebula_storage:/data/storage
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://risk-nebula-storaged:19779/status"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      risk-nebula-metad: {condition: service_healthy}

  risk-nebula-graphd:
    image: vesoft/nebula-graphd:v3.8.0
    container_name: aegis-risk-nebula-graphd
    profiles: ["risk"]
    restart: unless-stopped
    logging: *default-logging
    command:
      - --meta_server_addrs=risk-nebula-metad:9559
      - --port=9669
      - --local_ip=risk-nebula-graphd
      - --ws_ip=risk-nebula-graphd
      - --ws_http_port=19669
      - --log_dir=/logs
      - --v=0
      - --minloglevel=0
      - --enable_authorize=true
      - --session_idle_timeout_secs=3600
    ports:
      - "127.0.0.1:${RISK_NEBULA_PORT:-9669}:9669"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://risk-nebula-graphd:19669/status"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    # storaged 要等 graphd 上执行 ADD HOSTS 才会就绪（risk-migrate 负责），这里只等它起来
    depends_on:
      risk-nebula-metad: {condition: service_healthy}
      risk-nebula-storaged: {condition: service_started}

  # ── ClickHouse：决策流水、事件、告警、处置记录 ──
  risk-clickhouse:
    image: clickhouse/clickhouse-server:26.8
    container_name: aegis-risk-clickhouse
    profiles: ["risk"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      CLICKHOUSE_DB: aegis_risk
      CLICKHOUSE_USER: ${RISK_CLICKHOUSE_USER:-aegis}
      CLICKHOUSE_PASSWORD: ${RISK_CLICKHOUSE_PASSWORD:-aegis-risk}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    ports:
      - "127.0.0.1:${RISK_CLICKHOUSE_HTTP_PORT:-18123}:8123"
      - "127.0.0.1:${RISK_CLICKHOUSE_PORT:-19000}:9000"
    volumes:
      - risk_clickhouse:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── RisingWave：流式特征（读 NATS JetStream，物化视图经 Redis Sink 写回 Redis Cluster）──
  risk-risingwave:
    image: risingwavelabs/risingwave:v3.1.1
    container_name: aegis-risk-risingwave
    profiles: ["risk"]
    restart: unless-stopped
    logging: *default-logging
    command:
      - single_node
      - --store-directory=/risingwave/data
      - --listen-addr=0.0.0.0:4566
      # 单节点要分给 compactor 足够内存（小于约 6 GB 时 compactor 启动断言失败）
      - --total-memory-bytes=${RISK_RISINGWAVE_MEMORY_BYTES:-8589934592}
      # 免费许可证最多 4 核（rwu_limit=4）
      - --parallelism=${RISK_RISINGWAVE_PARALLELISM:-4}
    environment:
      RW_TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:${RISK_RISINGWAVE_PORT:-4566}:4566"
    volumes:
      - risk_risingwave:/risingwave/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'printf \"\" > /dev/tcp/127.0.0.1/4566' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # ── 一次性初始化：建库建表、图空间、向量集合、JetStream 流、RisingWave 基础源 ──
  risk-migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/risk.Dockerfile
    image: aegis-risk:latest
    container_name: aegis-risk-migrate
    profiles: ["risk"]
    restart: "no"
    logging: *default-logging
    environment:
      <<: *risk-env
    command: ["/usr/local/bin/risk-admin", "migrate"]
    depends_on:
      postgres: {condition: service_healthy}
      nats: {condition: service_healthy}
      risk-redis-init: {condition: service_completed_successfully}
      risk-clickhouse: {condition: service_healthy}
      risk-nebula-graphd: {condition: service_healthy}
      risk-milvus: {condition: service_healthy}
      risk-risingwave: {condition: service_healthy}
      risk-minio: {condition: service_healthy}

  # ── 在线决策（Kitex :8890，注册到 etcd；可 --scale 水平扩容）──
  risk-decision:
    image: aegis-risk:latest
    profiles: ["risk"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *risk-env
      RISK_DECISION_ADDR: 0.0.0.0:8890
    command: ["/usr/local/bin/risk-decision"]
    volumes:
      - risk_decision_spool:/var/lib/aegis-risk
    healthcheck:
      test: ["CMD", "/usr/local/bin/risk-admin", "probe", "http://127.0.0.1:8892/readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    depends_on:
      risk-migrate: {condition: service_completed_successfully}

  # ── 管理接口（Hertz :8891，主服务把 /api/admin/risk/* 代理过来）──
  risk-admin:
    image: aegis-risk:latest
    container_name: aegis-risk-admin
    profiles: ["risk"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *risk-env
      RISK_ADMIN_ADDR: 0.0.0.0:8891
    command: ["/usr/local/bin/risk-admin"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/risk-admin", "probe", "http://127.0.0.1:8891/readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    depends_on:
      risk-migrate: {condition: service_completed_successfully}

  # ── 事件落地：ClickHouse / 图 / 向量 / 名单命令 / CEP 告警处置 ──
  risk-ingest:
    image: aegis-risk:latest
    profiles: ["risk"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *risk-env
    command: ["/usr/local/bin/risk-ingest"]
    depends_on:
      risk-migrate: {condition: service_completed_successfully}

  # ── Flink CEP：application 模式，jobmanager 直接带着作业启动 ──
  risk-flink-jobmanager:
    build:
      context: ../..
      dockerfile: deploy/docker/risk-cep.Dockerfile
    image: aegis-risk-cep:latest
    container_name: aegis-risk-flink-jobmanager
    profiles: ["risk"]
    restart: unless-stopped
    logging: *default-logging
    command: ["standalone-job", "--job-classname", "aegis.risk.cep.RiskCepJob"]
    environment:
      RISK_NATS_URL: nats://nats:4222
      RISK_ADMIN_URL: http://risk-admin:8891
      RISK_INTERNAL_TOKEN: ${RISK_INTERNAL_TOKEN:-}
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: risk-flink-jobmanager
        parallelism.default: 2
        state.backend.type: rocksdb
        execution.checkpointing.dir: file:///flink-data/checkpoints
        execution.checkpointing.interval: 30s
        execution.checkpointing.mode: EXACTLY_ONCE
        restart-strategy.type: exponential-delay
        high-availability.type: NONE
    ports:
      - "127.0.0.1:${RISK_FLINK_UI_PORT:-8081}:8081"
    volumes:
      - risk_flink:/flink-data
    depends_on:
      risk-admin: {condition: service_healthy}
      nats: {condition: service_healthy}

  risk-flink-taskmanager:
    image: aegis-risk-cep:latest
    profiles: ["risk"]
    restart: unless-stopped
    logging: *default-logging
    command: ["taskmanager"]
    environment:
      RISK_NATS_URL: nats://nats:4222
      RISK_ADMIN_URL: http://risk-admin:8891
      RISK_INTERNAL_TOKEN: ${RISK_INTERNAL_TOKEN:-}
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: risk-flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        state.backend.type: rocksdb
        execution.checkpointing.dir: file:///flink-data/checkpoints
    volumes:
      - risk_flink:/flink-data
    depends_on:
      - risk-flink-jobmanager

volumes:
  postgres_data:
  aegis_autocert:
  redis_data:
  nats_data:
  nats_ui_data:
  risk_etcd_1:
  risk_etcd_2:
  risk_etcd_3:
  risk_redis_1:
  risk_redis_2:
  risk_redis_3:
  risk_redis_4:
  risk_redis_5:
  risk_redis_6:
  risk_minio:
  risk_milvus:
  risk_nebula_meta:
  risk_nebula_storage:
  risk_clickhouse:
  risk_risingwave:
  risk_flink:
  risk_decision_spool:
  # 保留 external 命名：兼容既有部署中已存在的 Temporal 数据卷，避免升级丢数据
  temporal_postgres_data:
    external: true
    name: docker_temporal_postgres_data
